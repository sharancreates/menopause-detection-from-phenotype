services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: menophenotype:latest
    container_name: menophenotype-app
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./artifacts:/app/artifacts:ro
    restart: unless-stopped
